<style>
/* Layout: answer-sheet app — sticky top bar, one centered column (max 760px), task cards, bottom-free */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1222; --surface:#171C31; --sunk:#10152A; --line:#2A3150;
  --ink:#E8EBF5; --muted:#99A1B9; --accent:#7D8CFF; --accent-ink:#0E1222; --accent-soft:#232B55;
  --band:#F5B82E; --band-ink:#2A1E00;
  --ok:#4CCB97; --ok-soft:#143326; --bad:#F07C7C; --bad-soft:#3A1A1E; --warn:#E0A43A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1222; --surface:#171C31; --sunk:#10152A; --line:#2A3150;
  --ink:#E8EBF5; --muted:#99A1B9; --accent:#7D8CFF; --accent-ink:#0E1222; --accent-soft:#232B55;
  --band:#F5B82E; --band-ink:#2A1E00;
  --ok:#4CCB97; --ok-soft:#143326; --bad:#F07C7C; --bad-soft:#3A1A1E; --warn:#E0A43A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

textarea{min-height:280px;line-height:1.6;resize:vertical}

.fb{border-radius:10px;padding:12px 14px;font-size:14.5px}

.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.bandbox{background:var(--band);color:var(--band-ink);border-radius:14px;padding:12px 20px;text-align:center}

.meter{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:14px}

.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

ul.tight{margin:6px 0;padding-left:20px}ul.tight li{margin:3px 0}

details summary{cursor:pointer;font-weight:700}

<script>
/* ============ STORAGE ============ */
const KEY='bandwise-v1';
const blank={xp:0,days:{},history:[],types:{},start:null,drafts:{},planDone:{}};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign({},blank,JSON.parse(r)):{...blank}}catch(e){return {...blank}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const todayStr=()=>new Date().toISOString().slice(0,10);
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(S.days[k]){n++;d.setDate(d.getDate()-1)}else{if(n===0&&k===todayStr()){d.setDate(d.getDate()-1);continue}break}}return n}
function addXP(n){S.xp+=n;S.days[todayStr()]=(S.days[todayStr()]||0)+n;save();hdr();toast('+'+n+' XP')}
function hdr(){xpChip.textContent=S.xp+' XP';streakChip.textContent='🔥 '+streak()+' gün'}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[.,]/g,'').replace(/\s+/g,' ').trim();

/* ============ BAND TABLES (gayriresmî) ============ */
const LBAND=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[0,3.5]];
const RBAND=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[0,3.5]];
function band(skill,correct,total){const raw=Math.round(correct/total*40);const t=skill==='L'?LBAND:RBAND;for(const[m,b]of t)if(raw>=m)return b;return 3.5}

/* ============ CONTENT ============ */
const TYPE_NAMES={tfng:'True / False / Not Given',heading:'Matching Headings',gap:'Boşluk doldurma',mcq:'Multiple choice',article:'Articles (a/an/the)',prep:'Prepositions',agree:'Subject–verb agreement',count:'Countable / uncountable',colloc:'Collocations',signpost:'Signposting',predict:'Tahmin (prediction)',trend:'Task 1 trend dili'};

const SETS=[
/* ---------- READING ---------- */
{id:'r1',skill:'R',title:'The Return of the Night Train',sub:'T/F/NG + boşluk + çoktan seçmeli',min:15,
passage:[
['A','For most of the twentieth century, overnight sleeper trains were an ordinary way to cross Europe. By the early 2000s, however, many routes had been withdrawn. Low-cost airlines could carry passengers between capitals in under two hours, and national rail operators judged that the carriages, which are expensive to maintain and are used only once every twenty-four hours, no longer justified their cost.'],
['B','Since around 2016 the picture has changed. Austria\'s state railway took over several routes that German operators had abandoned and, rather than reducing services, invested in new carriages. Its passenger numbers rose steadily, and other operators followed with new connections between cities such as Vienna, Brussels and Paris.'],
['C','Surveys suggest that environmental concern is one reason for this revival. A rail journey generally produces a fraction of the carbon emissions of the equivalent flight. Yet researchers caution that green values alone rarely change behaviour. Travellers also mention practical advantages: a sleeper departs from the city centre, avoids airport security queues and saves the cost of a hotel night.'],
['D','Problems remain. Tickets are frequently more expensive than flights, partly because operators must pay a separate track-access charge in every country they pass through. Booking can also be complicated, since there is no single European system that sells tickets for all operators. Some campaigners argue that governments should reduce track charges for night services, although this proposal has not yet been widely adopted.']],
qs:[
{t:'tfng',q:'Sleeper carriages are costly partly because they are used only once a day.',a:'TRUE',why:'Paragraf A: "expensive to maintain and are used only once every twenty-four hours". "Once a day" = "once every twenty-four hours" parafrazı. Bilgi açıkça var → TRUE.'},
{t:'tfng',q:'Austria\'s railway reduced its night services after taking over German routes.',a:'FALSE',why:'Paragraf B: "rather than reducing services, invested in new carriages". Metin tam tersini söylüyor → FALSE. NG değil, çünkü konu metinde var ve çelişiyor.'},
{t:'tfng',q:'Most passengers choose night trains mainly for environmental reasons.',a:'NOT GIVEN',why:'Paragraf C çevrenin "one reason" (nedenlerden biri) olduğunu söylüyor. "Most passengers… mainly" oranı hiç verilmiyor. Metin buna ne evet ne hayır diyor → NOT GIVEN. Tuzak: "most" gibi ölçü kelimeleri.'},
{t:'tfng',q:'Night-train tickets are often more expensive than flights.',a:'TRUE',why:'Paragraf D: "Tickets are frequently more expensive than flights". frequently = often.'},
{t:'gap',q:'Operators have to pay a track-access ______ in each country. (ONE WORD)',a:['charge'],why:'Paragraf D: "a separate track-access charge in every country". Kelimeyi metinden aynen al. "charges" çoğul olursa cümleye uymaz (a … charge).'},
{t:'gap',q:'Unlike airports, a sleeper train leaves from the city ______. (ONE WORD)',a:['centre','center'],why:'Paragraf C: "departs from the city centre". Amerikan yazımı "center" da kabul edilir.'},
{t:'mcq',q:'According to the researchers in paragraph C, environmental values…',o:['are the main reason the night train has returned.','are usually not enough by themselves to change how people travel.','have no effect on how travellers choose transport.','matter more to train operators than to passengers.'],a:1,
 whys:['Paragraf çevreyi "one reason" diye sunuyor, ana neden demiyor.','Doğru: "green values alone rarely change behaviour" = tek başına yeterli değil.','Aşırı ifade: "no effect" denmiyor, "alone rarely" deniyor. Uç kelimelere dikkat.','Operatörlerin değerlerinden hiç bahsedilmiyor.']},
{t:'mcq',q:'What does the writer say about lowering track charges?',o:['It has been introduced across Europe.','It was rejected by campaigners.','It is suggested but not yet common.','It would make booking simpler.'],a:2,
 whys:['"has not yet been widely adopted" — yaygın değil.','Öneriyi kampanyacılar yapıyor, reddetmiyor.','Doğru: "proposal has not yet been widely adopted".','Rezervasyon sorunu ayrı bir problem, ücretle bağlanmıyor.']}
]},
{id:'r2',skill:'R',title:'Urban Heat Islands',sub:'Matching Headings — ana fikri bulma',min:12,
passage:[
['A','On a still summer evening, the centre of a large city can be several degrees warmer than the surrounding countryside. This phenomenon, known as the urban heat island, was first recorded in London in the early nineteenth century, when an amateur scientist compared thermometer readings taken in the city with those from nearby villages.'],
['B','The causes are well understood. Asphalt and concrete absorb sunlight during the day and release it slowly at night. Tall buildings trap warm air and block the wind that would otherwise cool the streets. Air conditioners, vehicles and factories add further heat. Meanwhile, the lack of trees and soil means there is little evaporation, which in rural areas helps to lower temperatures.'],
['C','The consequences go beyond discomfort. During heatwaves, death rates in cities rise sharply, particularly among elderly residents living alone. Higher temperatures also increase the demand for electricity, which can overload power networks at the very moment they are most needed, and they speed up the chemical reactions that produce ground-level smog.'],
['D','Cities have begun to respond. Some have painted roofs white so that they reflect rather than absorb sunlight. Others are planting trees along streets, creating "green roofs" covered in vegetation, or replacing car parks with small parks. In Medellín, Colombia, a network of green corridors reduced local temperatures by around two degrees.'],
['E','However, measuring the success of such projects is not simple. Temperature varies greatly from one street to the next, and a single sensor may give a misleading picture. Researchers increasingly rely on satellite images combined with dense networks of low-cost sensors to judge which measures really work.']],
headings:['i. A difficulty in evaluating solutions','ii. How the effect was first noticed','iii. Why cities lose and gain heat','iv. The cost of air conditioning','v. Practical ways to cool cities','vi. Risks to health and infrastructure','vii. Rural areas are getting hotter'],
qs:[
{t:'heading',q:'Paragraph A',a:'ii',why:'İlk ve son cümle: tanım + "first recorded in London". Paragrafın işi olayın ilk nasıl fark edildiğini anlatmak → ii.'},
{t:'heading',q:'Paragraph B',a:'iii',why:'"The causes are well understood" — paragraf nedenleri sıralıyor (asfalt, binalar, klima). iv tuzak: klima sadece bir detay, paragrafın konusu değil.'},
{t:'heading',q:'Paragraph C',a:'vi',why:'"consequences" → ölüm oranları (sağlık) + elektrik şebekesi (altyapı). İki detayı birden kapsayan başlık vi.'},
{t:'heading',q:'Paragraph D',a:'v',why:'"Cities have begun to respond" + beyaz çatılar, ağaçlar, yeşil koridorlar = pratik çözümler.'},
{t:'heading',q:'Paragraph E',a:'i',why:'"However, measuring the success … is not simple" — çözümleri değerlendirmenin zorluğu. "However" ile başlayan paragraflar çoğu zaman önceki fikre bir sınır getirir.'}
]},
{id:'r3',skill:'R',title:'Why We Forget',sub:'Özet tamamlama + çoktan seçmeli',min:14,
passage:[
['A','In the 1880s the German psychologist Hermann Ebbinghaus spent years memorising lists of meaningless syllables and testing himself at different intervals. He found that most of what he learned was lost within the first day, after which forgetting slowed considerably. His results, drawn as the "forgetting curve", remain among the most frequently replicated findings in psychology.'],
['B','Ebbinghaus also noticed that each time he reviewed a list, it took him less effort to relearn it, and the material lasted longer before fading. Modern researchers call this the spacing effect: reviewing information several times, with increasing gaps between sessions, produces far stronger memories than the same amount of study concentrated into one session.'],
['C','A second finding concerns the method of review. Simply rereading notes creates a feeling of familiarity, which students often mistake for understanding. In contrast, trying to recall information without looking — a technique known as retrieval practice — feels harder but leads to better long-term retention. Several studies have found that students who tested themselves remembered roughly fifty per cent more a week later than those who reread.'],
['D','Forgetting is not always a failure, however. Some scientists argue that the brain deliberately discards details that are not used, which allows it to generalise and to adapt to new situations. From this point of view, a perfect memory would be less a gift than a burden.']],
qs:[
{t:'gap',q:'Summary: Ebbinghaus found that most forgetting happens within the first ______. (ONE WORD)',a:['day'],why:'Paragraf A: "lost within the first day".'},
{t:'gap',q:'Reviewing with increasing gaps is called the ______ effect. (ONE WORD)',a:['spacing'],why:'Paragraf B: "Modern researchers call this the spacing effect".'},
{t:'gap',q:'Rereading produces a sense of ______ that students confuse with understanding. (ONE WORD)',a:['familiarity'],why:'Paragraf C: "creates a feeling of familiarity". Özet sorularında kelime türüne dikkat: "a sense of ___" → isim gerekiyor.'},
{t:'gap',q:'Recalling information without looking is known as retrieval ______. (ONE WORD)',a:['practice'],why:'Paragraf C: "a technique known as retrieval practice".'},
{t:'mcq',q:'In paragraph C, students who tested themselves…',o:['found the method easier than rereading.','remembered about half as much as rereaders.','remembered around fifty per cent more after a week.','understood the material immediately.'],a:2,
 whys:['Tam tersi: "feels harder".','Ters çevrilmiş sayı tuzağı: "fifty per cent more", "half as much" değil.','Doğru: "roughly fifty per cent more a week later".','"immediately" metinde yok, sonuç bir hafta sonra ölçülüyor.']},
{t:'mcq',q:'What is the writer\'s main point in paragraph D?',o:['A perfect memory would be very useful.','Forgetting can serve a useful purpose.','Scientists cannot explain forgetting.','Details are more important than general ideas.'],a:1,
 whys:['Yazar tersini söylüyor: "less a gift than a burden".','Doğru: "Forgetting is not always a failure" + beyin genelleme için ayrıntı atıyor.','Bir açıklama veriliyor, bilinmiyor denmiyor.','Metin genellemenin değerini vurguluyor, ayrıntının değil.']}
]},

/* ---------- LISTENING ---------- */
{id:'l1',skill:'L',title:'Section 1 · Joining a Sports Centre',sub:'Form doldurma · iki konuşmacı',min:10,
predict:true,
script:[
['W','Good morning, Riverside Sports Centre. How can I help?'],
['M','Hi, I\'d like to become a member, please.'],
['W','Of course. Can I take your surname first?'],
['M','Yes, it\'s Harrington. That\'s H, A, double R, I, N, G, T, O, N.'],
['W','Thank you. And which membership are you interested in? We have standard, off-peak and family.'],
['M','I was thinking of standard, but actually I only come in the mornings, so off-peak would be better.'],
['W','Good choice. Off-peak is twenty-eight pounds a month. Standard is forty.'],
['M','Twenty-eight is fine. Do I need to bring anything for my induction?'],

{id:'w2a',skill:'W',kind:'write',task:2,title:'Task 2 · Free university education',sub:'Opinion · 40 dk · 250+ kelime',min:40,
prompt:'Some people think that the government should provide free university education for all students. To what extent do you agree or disagree?',
plan:['Görüşünü seç: mostly agree / disagree (ikisinin ortası netlik kaybettirir).','Body 1: en güçlü nedenin + açıklama + örnek.','Body 2: ikinci neden ya da karşı görüşü kabul edip cevapla.','Sonuç: yeni fikir yok, görüşünü tekrar et.'],
model:`Whether higher education should be funded entirely by the state is a question that divides many societies. While I accept that free tuition places a heavy burden on public budgets, I largely agree that university should be available to every capable student without charge.

The main reason is that tuition fees prevent talented students from poorer families from studying. When young people must take on large loans, many choose to enter work immediately instead, even when they have the ability to succeed academically. A country that loses these students also loses future doctors, engineers and teachers. Germany, which abolished tuition fees in 2014, shows that a strong economy can sustain this policy.

Admittedly, critics point out that taxpayers who never attend university would be paying for those who do. This concern is reasonable, but graduates generally earn higher salaries and therefore return more in income tax over their careers. In this sense, free education is less a gift than an investment that the state recovers over time.

In conclusion, although funding free university education is expensive, I believe the long-term benefits for social mobility and the economy outweigh the cost.`},

model:`The line graph compares the proportion of households with internet access in Norway, Brazil and India over a twenty-year period from 2000.

Overall, access rose in all three countries. Norway had by far the highest rate throughout, while Brazil and India, despite starting from very low levels, experienced the most rapid growth, particularly after 2010.

In 2000, just over half of Norwegian households (52%) were online, compared with only 5% in Brazil and 1% in India. Norway's figure climbed steadily to 90% by 2010, after which growth slowed as it approached saturation, reaching 98% in 2020.

Brazil's figure rose gradually to 27% in 2010 and then almost doubled to 51% within five years, ending the period at 71%. India followed a similar but slower pattern: access remained below 10% until 2010, before increasing sharply to 43% in 2020. Nevertheless, this was still less than half the Norwegian rate.`},

function planPos(){if(!S.start)return null;const d0=new Date(S.start+'T00:00:00'),now=new Date(todayStr()+'T00:00:00');const diff=Math.floor((now-d0)/864e5);if(diff<0)return{week:1,dow:0,idx:0};const idx=Math.min(diff,83);return{week:Math.floor(idx/7)+1,dow:idx%7,idx}}
function monthOf(w){return w<=4?1:w<=8?2:3}

function recordType(t,ok){const r=S.types[t]||{c:0,n:0};r.n++;if(ok)r.c++;S.types[t]=r}
function weakest(){let best=null;for(const[t,r]of Object.entries(S.types)){if(r.n<3)continue;const p=r.c/r.n;if(!best||p<best.p)best={t,p,...r}}return best}
function setForType(t){return SETS.find(s=>s.qs&&s.qs.some(q=>q.t===t))}

function qHTML(q,i,s){
 let body='';
 if(q.t==='tfng')body=`<div class="opts">${['TRUE','FALSE','NOT GIVEN'].map(o=>`<button class="opt" data-q="${i}" data-v="${o}"><span class="k">${o[0]}</span><span>${o}</span></button>`).join('')}</div>`;
 else if(q.t==='heading')body=`<select id="q${i}" data-q="${i}"><option value="">Başlık seç…</option>${s.headings.map(h=>`<option value="${h.split('.')[0]}">${esc(h)}</option>`).join('')}</select>`;
 else if(q.o)body=`<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-v="${j}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}<div class="why" hidden></div></span></button>`).join('')}</div>`;
 else body=`${q.pred?`<input type="text" id="p${i}" placeholder="Tahminin: ne tür bir cevap gelecek?" style="font-size:14px">`:''}<input type="text" id="q${i}" data-q="${i}" autocomplete="off" placeholder="Cevabın">`;
 return `<div class="q" id="qq${i}"><span class="qn">Soru ${i+1} · ${TYPE_NAMES[q.t]||q.t}</span><div>${esc(q.q)}</div>${body}<div class="fb" id="fb${i}" hidden></div></div>`}
function bindQuiz(s){
 app.querySelectorAll('.opt[data-q]').forEach(b=>b.onclick=()=>{if(running.checked)return;const i=b.dataset.q;running.ans[i]=b.dataset.v;app.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.toggle('sel',x===b));cnt()});
 app.querySelectorAll('input[data-q],select[data-q]').forEach(e=>e.oninput=()=>{running.ans[e.dataset.q]=e.value;cnt()});cnt()}
function cnt(){const n=Object.values(running.ans).filter(v=>v!=='').length;const c=document.getElementById('cnt');if(c)c.textContent=n+'/'+running.s.qs.length+' cevaplandı'}
function isRight(q,v){if(v===undefined||v==='')return false;if(q.t==='tfng'||q.t==='heading')return v===q.a;if(q.o)return +v===q.a;return q.a.some(a=>norm(a)===norm(v))}
function checkQuiz(){
 const s=running.s;if(running.checked)return;running.checked=true;clearInterval(timerId);stopTTS();let c=0;
 s.qs.forEach((q,i)=>{const v=running.ans[i];const ok=isRight(q,v);if(ok)c++;recordType(q.t,ok);
  const fb=document.getElementById('fb'+i);
  if(q.o){app.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{const j=+x.dataset.v;if(j===q.a)x.classList.add('right');else if(String(j)===v)x.classList.add('wrong');const w=x.querySelector('.why');if(w){w.hidden=false;w.textContent=q.whys[j]}});fb.hidden=true}
  else{if(q.t==='tfng')app.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>{if(x.dataset.v===q.a)x.classList.add('right');else if(x.dataset.v===v)x.classList.add('wrong')});
   const inp=document.getElementById('q'+i);if(inp&&q.t!=='tfng')inp.classList.add(ok?'right':'wrong');
   fb.hidden=false;fb.className='fb '+(ok?'ok':'no');fb.innerHTML=`<b>${ok?'Doğru.':'Doğru cevap: '+esc(Array.isArray(q.a)?q.a[0]:q.a)}</b> ${esc(q.why)}`}});
 const tot=s.qs.length,b=(s.skill==='R'||s.skill==='L')?band(s.skill,c,tot):null;const xp=c*5+(c===tot?10:0);
 S.history.push({id:s.id,skill:s.skill,title:s.title,score:c+'/'+tot,band:b,date:todayStr()});
 if(S._pendingPlan){S.planDone[S._pendingPlan]=1;delete S._pendingPlan}
 addXP(xp);
 const wrongs=s.qs.map((q,i)=>!isRight(q,running.ans[i])?q.t:null).filter(Boolean);const tally={};wrongs.forEach(t=>tally[t]=(tally[t]||0)+1);
 result.innerHTML=`<section class="card"><div class="score">${b?`<div class="bandbox"><div class="n">${b}</div><div class="l">tahmini band</div></div>`:''}<div><h2>${c}/${tot} doğru</h2><p class="small muted" style="margin:4px 0 0">${b?'40 soruya ölçeklenmiş gayriresmî tahmin. ':''}+${xp} XP</p></div></div>
 ${wrongs.length?`<div style="margin-top:14px"><div class="eyebrow">Debug: hataların nereden geldi?</div><ul class="tight">${Object.entries(tally).map(([t,n])=>`<li>${TYPE_NAMES[t]||t}: ${n} yanlış</li>`).join('')}</ul><p class="small">Her yanlışın altındaki açıklamayı oku ve kendine sor: <i>soruyu mu yanlış anladım, kelimeyi mi bilmiyordum, parafrazı mı kaçırdım?</i></p></div>`:'<p>Tam puan. Bir sonraki adım: aynı seti süreyi yarıya indirerek çöz.</p>'}
 ${s.script?`<details style="margin-top:10px"><summary>Transkript</summary><div class="script" style="margin-top:8px">${s.script.map(l=>`<p><b>${l[0]}:</b> ${esc(l[1])}</p>`).join('')}</div></details>`:''}
 <div class="row" style="margin-top:14px">${running.mock?`<button class="btn" onclick="mockNext(${c},${tot})">Sonraki bölüm →</button>`:`<button class="btn" onclick="openSet('${s.id}')">Tekrar çöz</button><a class="btn ghost" style="text-decoration:none" href="#practice">Başka set</a>`}</div></section>`;
 result.scrollIntoView({behavior:'smooth',block:'start'})}

function stopTTS(){try{speechSynthesis.cancel()}catch(e){}}
function playScript(){const s=running.s;if(!('speechSynthesis' in window)){ttsNote.textContent='Bu tarayıcı sesli okumayı desteklemiyor. Transkripti açıp hızlıca bir kez oku, sonra kapat ve cevapla.';ttsNote.insertAdjacentHTML('afterend',`<details><summary>Transkripti göster</summary><div class="script">${s.script.map(l=>`<p><b>${l[0]}:</b> ${esc(l[1])}</p>`).join('')}</div></details>`);return}
 stopTTS();const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)(GB|US|AU)/i.test(v.lang));const r=+document.getElementById('rate').value;
 const gb=vs.filter(v=>/GB/i.test(v.lang));const v1=gb[0]||vs[0],v2=gb[1]||vs.find(v=>v!==v1)||v1;
 playBtn.disabled=true;playBtn.textContent='Çalıyor…';
 s.script.forEach((l,k)=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang='en-GB';u.rate=r;if(l[0]==='M'){u.voice=v2;u.pitch=.8}else{u.voice=v1;u.pitch=l[0]==='W'?1.15:1}if(k===s.script.length-1)u.onend=()=>{playBtn.textContent='Kayıt bitti';};speechSynthesis.speak(u)})}

function startTimer(sec,id,done){clearInterval(timerId);let t=sec;const el=document.getElementById(id);const draw=()=>{if(!el)return;el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');el.classList.toggle('low',t<=60)};draw();timerId=setInterval(()=>{t--;draw();if(t<=0){clearInterval(timerId);done&&done()}},1000)}

function chartSVG(c){const W=560,H=280,L=40,R=90,T=16,B=34;const xs=i=>L+i*(W-L-R)/(c.years.length-1),ys=v=>T+(100-v)*(H-T-B)/100;
 const cols=['var(--accent)','var(--warn)','var(--ok)'];let g='';
 for(let v=0;v<=100;v+=25)g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`;
 c.years.forEach((y,i)=>g+=`<text x="${xs(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${y}</text>`);
 c.series.forEach(([n,d],k)=>{g+=`<polyline fill="none" stroke="${cols[k]}" stroke-width="2.5" points="${d.map((v,i)=>xs(i)+','+ys(v)).join(' ')}"/>`;d.forEach((v,i)=>g+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="3.5" fill="${cols[k]}"/>`);g+=`<text x="${W-R+8}" y="${ys(d[d.length-1])+4}" font-size="12" font-weight="700" fill="${cols[k]}">${n}</text>`});
 return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;font-family:var(--f-mono)" role="img" aria-label="Line graph: households with internet access">${g}</svg></div><p class="small muted" style="margin:4px 0 0">Households with internet access (%)</p>`}
const CHECK={1:['Girişte grafiği parafraz ettim (kopyalamadım).','Ayrı bir overview paragrafım var (genel trend, rakamsız).','En önemli özellikleri seçtim, her sayıyı yazmadım.','Karşılaştırma yaptım (higher than, twice as…).','Yorum veya kişisel görüş eklemedim.','150+ kelime.'],
 2:['Girişte soruyu cevapladım; görüşüm net.','Her body paragrafı bir topic sentence ile başlıyor.','Her fikre açıklama + örnek verdim.','Sonuçta yeni fikir yok.','Articles ve prepositions kontrol ettim.','250+ kelime.']};

 const ta=document.getElementById('essay');const up=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;wc.textContent=n+' kelime';wc.style.color=n>=lim?'var(--ok)':'';S.drafts[s.id]=ta.value;save()};ta.oninput=up;up()}

 const words=essay.value.toLowerCase().match(/[a-z']+/g)||[];const fq={};const stop=new Set('the a an and of to in is are that this it for on be as with by or which have has was were can will their they people more'.split(' '));words.forEach(w=>{if(!stop.has(w)&&w.length>3)fq[w]=(fq[w]||0)+1});const rep=Object.entries(fq).filter(([w,c])=>c>=4).sort((a,b)=>b[1]-a[1]).slice(0,5);
 S.history.push({id,skill:'W',title:s.title,score:n+' kelime · '+ticks+'/'+CHECK[s.task].length+' ✓',date:todayStr()});if(S._pendingPlan){S.planDone[S._pendingPlan]=1;delete S._pendingPlan}addXP(15+ticks*3);
 wres.innerHTML=`<div class="fb ${n>=lim?'ok':'no'}" style="margin-top:12px"><b>${n} kelime.</b> ${n>=lim?'Uzunluk tamam.':'Kelime sınırının altındasın; gerçek sınavda Task Response puanı düşer.'}</div>

function qTimer(b,sec){let t=sec;b.disabled=true;const iv=setInterval(()=>{t--;b.textContent=t+' sn';if(t<=0){clearInterval(iv);b.textContent='✓';}},1000);b.textContent=t+' sn'}
function speakFlow(){spBtn.disabled=true;spNote.textContent='Hazırlan: anahtar kelimeleri yaz.';startTimer(60,'tm',()=>{spNote.textContent='Konuş! 2 dakika boyunca durma.';toast('Konuşmaya başla');startTimer(120,'tm',()=>{spNote.textContent='Süre bitti. Kaydını dinle ve aşağıdaki listeyi doldur.';toast('Süre bitti')})})}
function finishSpeak(id){const s=SETS.find(x=>x.id===id);const t=[0,1,2,3,4,5].filter(i=>document.getElementById('sk'+i).checked).length;clearInterval(timerId);S.history.push({id,skill:'S',title:s.title,score:t+'/6 ✓',date:todayStr()});if(S._pendingPlan){S.planDone[S._pendingPlan]=1;delete S._pendingPlan}addXP(10+t*3);location.hash='#progress'}

/* ---- MINI MOCK ---- */
function openMock(){running={mockSteps:['l1','r1','w1a'],step:0,scores:[]};mockStart()}
function mockStart(){const id=running.mockSteps[running.step];const s=SETS.find(x=>x.id===id);const m={mockSteps:running.mockSteps,step:running.step,scores:running.scores};running={s,ans:{},checked:false,mock:m};
 if(s.kind==='write'){vWrite(s);app.insertAdjacentHTML('afterbegin',`<div class="fb ok"><b>Mock · bölüm ${m.step+1}/3.</b> Süreyi başlat ve 20 dakikada bitir.</div>`);setTimeout(()=>tbtn.click(),50)}
 else{vQuiz(s);app.insertAdjacentHTML('afterbegin',`<div class="fb ok"><b>Mock · bölüm ${m.step+1}/3.</b> Ara verme.</div>`)}}
function mockNext(c,t){const m=running.mock;m.scores.push([running.s.skill,c,t]);m.step++;running=m;if(m.step<m.mockSteps.length)return mockStart();
 app.innerHTML=`<section class="card"><h2>Mock tamamlandı</h2><ul class="tight">${m.scores.map(([k,c,t])=>`<li>${SK[k]}: ${t?c+'/'+t+' · band '+band(k,c,t):c+' kelime'}</li>`).join('')}</ul></section>`}

go();
</script>
</body></html>
